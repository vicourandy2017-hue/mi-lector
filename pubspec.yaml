name: mi_lector
description: Aplicación Lector Kindle / Mi Lector PDF y Audiolibros
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^8.1.4
  shared_preferences: ^2.2.2
  path_provider: ^2.1.2
  flutter_pdfview: ^1.3.2
  pdfx: ^2.6.0
  http: ^1.2.1
  url_launcher: ^6.2.5
  audioplayers: ^6.0.0
  flutter_tts: ^4.0.2
  epub_parser: any
  flutter_html: any
  webview_flutter: ^4.4.2     # <--- NUEVO: Para mostrar diccionario/Wikipedia interno

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.11.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/sounds/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/mi_logo.png"