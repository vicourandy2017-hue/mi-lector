name: libreria_2026
description: Mi Lector Pro — Biblioteca personal multimedia
publish_to: 'none'
version: 1.0.8+8

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── Lectura de documentos ─────────────────────────────────────────────────
  pdfx: ^2.6.0
  syncfusion_flutter_pdf: ^24.2.8
  epub_parser: ^3.0.1
  flutter_html: ^3.0.0-beta.2
  archive: ^3.6.1
  xml: ^5.4.1

  # ── Reproductores multimedia ──────────────────────────────────────────────
  audioplayers: ^6.0.0
  video_player: ^2.8.0
  flutter_tts: ^4.0.0

  # ── Gestión de archivos ────────────────────────────────────────────────────
  file_picker: ^10.2.4
  path_provider: ^2.1.0
  permission_handler: ^11.0.0

  # ── Almacenamiento y datos ─────────────────────────────────────────────────
  shared_preferences: ^2.2.0

  # ── Monetización ──────────────────────────────────────────────────────────
  in_app_purchase: ^3.2.0

  # ── Web y navegación ──────────────────────────────────────────────────────
  webview_flutter: ^4.8.0
  url_launcher: ^6.2.0

  # ── UI e íconos ────────────────────────────────────────────────────────────
  cupertino_icons: ^1.0.8
  flutter_pdfview: ^1.4.5

dependency_overrides:
  flutter_plugin_android_lifecycle: 2.0.20

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icono.png
    - assets/images/
    - assets/sounds/
